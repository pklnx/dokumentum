# gitleaks configuration for the secret-scan CI check and the pre-commit hook.
# See docs/development/index.md, "Secret scan".
#
# Start from gitleaks' built-in rules. Add only narrow allowlist entries
# here: one [[allowlists]] block per test fixture, with `condition = "AND"`,
# the fixture's exact path and a regex for the fake value, and a comment
# saying why it is safe. Never add a global regex or a path glob.
#
# A single reviewed finding in the git history goes into .gitleaksignore by
# fingerprint instead, after the credential has been rotated.

title = "dokumentum"
minVersion = "v8.30.1"

[extend]
useDefault = true
