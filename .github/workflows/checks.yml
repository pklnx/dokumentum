name: Checks

# Checks that run on Linux. Build and app tests run on GitHub Actions macOS runners (app.yml; docs/development/plan.md, section 4).
# There is deliberately no `paths` filter: these jobs are required checks, so they must run on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The schema check compares snapshots of Production versions with the base commit.
          fetch-depth: 0
      - name: Script self-tests
        run: |
          python3 scripts/check-labels.py --self-test
          python3 scripts/check-project.py --self-test
          python3 scripts/check-localization.py --self-test
          python3 scripts/check-test-waits.py --self-test
          python3 scripts/check-logging.py --self-test
          python3 scripts/check-schema-snapshots.py --self-test
          python3 scripts/check-cloudkit-schema.py --self-test
          python3 scripts/app-scope.py --self-test
      - name: Labels file
        run: python3 scripts/check-labels.py
      - name: Xcode project
        run: python3 scripts/check-project.py
      - name: Test waits
        run: python3 scripts/check-test-waits.py
      - name: Logging
        run: python3 scripts/check-logging.py
      - name: Schema snapshots
        env:
          # The PR's base, or the commit before a push to main.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/check-schema-snapshots.py --base "$BASE"

  localization:
    name: localization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: String Catalog
        run: python3 scripts/check-localization.py --catalog

  # The only job with the Swift toolchain (one download per run, no cache).
  kit-linux:
    name: kit-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install-swift
      - name: swift format lint
        run: swift format lint --strict --recursive --configuration .swift-format Dokumentum*/ Packages/
      - name: DokumentumKit tests
        run: swift test --package-path Packages/DokumentumKit
