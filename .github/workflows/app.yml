name: App

# Build and app tests on GitHub Actions macOS runners, the PR check since 2026-11-12 (docs/development/plan.md,
# section 6, question 1). Both jobs mirror Xcode Cloud's former "Default - iOS" and "Default - macOS" actions:
# the Dokumentum scheme, built unsigned, then the Default test plan (.github/actions/app-test). The UISmoke plan
# runs only in release.yml.
# `app-ios` and `app-macos` are required checks: they always run and always report, and there is deliberately
# no `paths` filter. The scope is decided in the `scope` job (scripts/app-scope.py): a pull request that changes
# only docs and process files skips build and tests and passes with a note in the job summary; anything else, or
# anything unknown, runs the full Default plan, and so does a failed `scope` job (its output is then empty). Every push to main and a nightly schedule run the full plan.
# The tests run in parallel, as the test plan sets. Until #164 they ran serially: in parallel mode the
# DokumentumCoreTests process froze on these 3-CPU runners, because test hooks blocked all three threads of
# the cooperative pool; tests no longer block pool threads (docs/development/index.md, "Waiting in tests").
# No per-test time allowance is set: it is not verified that -test-timeouts-enabled bounds Swift Testing tests,
# and a frozen pool stops `.timeLimit` as well, so the bound of a stuck run is the job timeout.
# `xcode-27` is a preview runner image; it has Xcode 27.1 as the default, so the action selects the pinned Xcode. A skipped run does not need it, so it uses a Linux runner.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly, full plan on both platforms. Off the hour.
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The changed files are the diff against the merge base.
          fetch-depth: 0
      - name: Scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 scripts/app-scope.py --self-test
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/app-scope.py --base "$BASE" --head "$HEAD"
          else
            python3 scripts/app-scope.py --full
          fi

  app-ios:
    name: app-ios
    needs: scope
    # Always run, also when `scope` failed or was cancelled by nobody: an empty scope output is not `docs`, so the
    # full plan runs. A skipped job would satisfy the ruleset, so these jobs must never be skipped.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.scope.outputs.scope == 'docs' && 'ubuntu-24.04' || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: Skipped, docs only
        if: needs.scope.outputs.scope == 'docs'
        run: |
          echo "### app-ios: skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "This pull request changes only docs and process files (scripts/app-scope.py), so build and tests are skipped. Every push to main and the nightly run run the full Default plan." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.scope != 'docs'
        with:
          persist-credentials: false
      - uses: ./.github/actions/app-test
        if: needs.scope.outputs.scope != 'docs'
        with:
          destination: 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0'
          plans: Default
          artifact: app-ios-xcresult

  app-macos:
    name: app-macos
    needs: scope
    # Always run, also when `scope` failed or was cancelled by nobody: an empty scope output is not `docs`, so the
    # full plan runs. A skipped job would satisfy the ruleset, so these jobs must never be skipped.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.scope.outputs.scope == 'docs' && 'ubuntu-24.04' || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: Skipped, docs only
        if: needs.scope.outputs.scope == 'docs'
        run: |
          echo "### app-macos: skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "This pull request changes only docs and process files (scripts/app-scope.py), so build and tests are skipped. Every push to main and the nightly run run the full Default plan." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.scope.outputs.scope != 'docs'
        with:
          persist-credentials: false
      - uses: ./.github/actions/app-test
        if: needs.scope.outputs.scope != 'docs'
        with:
          destination: 'platform=macOS'
          plans: Default
          artifact: app-macos-xcresult
