name: App

# Build and app tests on GitHub Actions macOS runners, the PR check since 2026-11-12 (docs/development/plan.md,
# section 6, question 1). Both jobs mirror Xcode Cloud's former "Default - iOS" and "Default - macOS" actions:
# the Dokumentum scheme, built unsigned, then the Default test plan. The UISmoke plan is not part of it.
# There is deliberately no `paths` filter: these jobs are required checks, so they must run on every pull request.
# The tests run serially (-parallel-testing-enabled NO) as a workaround for #164: in parallel mode the
# DokumentumCoreTests process froze on these 3-CPU runners (no output, no time-limit failure; thread pool
# starvation is suspected, the trigger is not proven). The hosted app tests had finished. Switch back to
# parallel mode when #164 is fixed. No per-test time allowance is set: it is not verified that
# -test-timeouts-enabled bounds Swift Testing tests, and a frozen pool stops `.timeLimit` as well, so the
# bound of a stuck run is the job timeout.
# `xcode-27` is a preview runner image; it has Xcode 27.1 as the default, so each job selects the pinned Xcode.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: app-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The runners have 3 CPUs; every test wait multiplies its timeout by this (docs/development/index.md).
  # `xcodebuild` strips the TEST_RUNNER_ prefix and passes the variable on to the test host.
  TEST_RUNNER_DOKUMENTUM_TEST_TIMEOUT_SCALE: "3"
  # Agents' unsigned path: macOS without team and entitlements, the simulator keeps its real keys.
  XCODE_XCCONFIG_FILE: Config/Unsigned.xcconfig

jobs:
  app-ios:
    name: app-ios
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_$(tr -d '[:space:]' < .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Toolchain check
        run: CI_PRIMARY_REPOSITORY_PATH="$PWD" ci_scripts/ci_post_clone.sh
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -scheme Dokumentum -testPlan Default \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/build.xcresult"
      - name: Localisation
        run: python3 scripts/check-localization.py "$RUNNER_TEMP/DerivedData"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building -scheme Dokumentum -testPlan Default \
            -parallel-testing-enabled NO \
            -destination 'platform=iOS Simulator,name=iPhone 18 Pro,OS=27.0' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/test.xcresult"
      - name: Upload the result bundles
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-ios-xcresult
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  app-macos:
    name: app-macos
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned Xcode
        run: |
          echo "DEVELOPER_DIR=/Applications/Xcode_$(tr -d '[:space:]' < .xcode-version).app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Toolchain check
        run: CI_PRIMARY_REPOSITORY_PATH="$PWD" ci_scripts/ci_post_clone.sh
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing -scheme Dokumentum -testPlan Default \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/build.xcresult"
      - name: Localisation
        run: python3 scripts/check-localization.py "$RUNNER_TEMP/DerivedData"
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building -scheme Dokumentum -testPlan Default \
            -parallel-testing-enabled NO \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" -resultBundlePath "$RUNNER_TEMP/test.xcresult"
      - name: Upload the result bundles
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-macos-xcresult
          path: ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
