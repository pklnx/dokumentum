name: Secrets

# Scans the commits each pull request adds and every push to main for committed
# credentials with gitleaks (pinned binary, SHA-256 checked below).
# There is deliberately no `paths` or `paths-ignore` filter: secret-scan is a
# required check, so it must run on every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests share a group per ref and cancel older runs (the next run scans
# the whole PR again). Each push to main gets its own group, keyed by its SHA,
# so no push is cancelled or replaced while queued and none goes unscanned.
concurrency:
  group: secrets-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The binary comes from the release page and is checked against the
      # SHA-256 above, so no third-party action runs with a token.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      # Checks that the scan fails and passes where it should.
      - name: Self-test
        run: GITLEAKS="$PWD/gitleaks" sh scripts/secret-scan-test.sh
      # --redact keeps secret values out of the job log.
      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          LOG_OPTS=$(sh scripts/secret-scan-range.sh)
          echo "Scanning: git log $LOG_OPTS"
          ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 --no-banner --log-opts="$LOG_OPTS" .
